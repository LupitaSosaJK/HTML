<!-- 
 
 Para crear la estructura basica podemos usar Emmet.

 Emmet es una herramienta de autocompleto integrado en VSHC.

 El shortcut para escribir la estructura: !

 Atributos

 Lang: Determina el idioma en que esta escrto el documento
 charset: Determina el conjunto de caracteres que se usa en el documento

 etiquetas

 Meta viewport: Permite que nuestro documento se vea xorrectamente en dispositivos moviles. Siempre debe de estar.
 
 title: Define el titulo del documento. Este titulo si  es visible para el usuario y se ubica en las pestañas del navegador.
 
 -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepa la bola que es esto</title>
</head>
<body>
    
</body>
</html>
