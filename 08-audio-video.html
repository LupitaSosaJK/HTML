<!-- 
 Audion y Video

 Estas etiquetas nos permiten insertar contenido multimedia.
 
  <audio>...</audio>
  <video>...</audio>

  Parametros
  
  - controls muestra los controles de las etiquetas
  -autoplay reproduce automaticamente
  -loop repite el contenido en bucle
  -muted no reproduce el audio

   Elemto Source
   
   Dentro de las etiquetas <audio> y >video> se define la etiqueta<source /> y a esta etiqueta le pasamos el oarametro "src" que recibe como valor la ubicacion del contenido

-->




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio y Video</title>
</head>
<body>
    <h1> Audio y Video</h1>

   <h2>Contenido de audio</h2>
   <audio controls autoplay muted >
     <source src="multimedia/audio.mp3"/>
     Tu navegador no es compatible con el contenido multimedia, cambia aun navegador moderno.
    </audio>


   <h2>contenido de video</h2>
   <video controls autoplay muted loop width="1022px" height="240">
     <source src="multimedia/video.mp4"/>
     Tu navegador no es compatible con el contenido multimedia, cambia aun navegador moderno.
   </video>

   <h2>Contenido de video</h2>
   <video></video>



</body>
</html>
