<!-- 
   Etiquetas Genericas

   Existen dos que nos ayuda a crear elementos de tipo bloque y linea

   div. se usa como un contenedor de division y semanticamente no significa nada.Sirve para contenedor de bloque.

   span Es un contenedor de tipo linea, se suele usar para encerrar palabras o peuqeños textos, semanticamente no significa nada.

   contenedor de bloque- ocupa todo el el ancho disponoble y daran un saltoo de linea.

   contenedor de linea va ocupar el ancho de su contenido y no da salto de linea




-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Genericas</title>
</head>
<body>
    <h1>Etiquetas genericas</h1>

    <div>
        Este es un <span style="color: red;">elemento</span> de bloque!
    </div>

    <div>
        Este es otro elemento de bloque! <span>y este es otro elemto de linea!</span>
     </div>

</body>
</html>
