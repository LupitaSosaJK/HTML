<!--

  Imagenes

  Para colocar imagenes de html usamos la etiqueta:

  <img />
  Esta etiqueta es de autocierre (self closing). En html S la / ya noo es necesaria, pero se considera una buena practica utilizarla.

  El atributo "src" (source u origen) le indica a la etiqueta la imagen a mostrar. Puede recibir una url externa o la ruta (path) interna.

  El atributo "alt" (alternative text o texto alternativo) es un texto que se mostrara en caso de que la imegen no puede ser renderizada por el  navegador. Este atributo es el obligatorio, por  que se utiliza como apoyo en accesibilidad.

  Los artributos width y height nos permite manipular el tamaño  



-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagenes</title>
</head>
<body>
   <h1>Imagenes</h1>
   <p> Las imagenes noos permiten colocar elementos visuales en los sitios web</p>

   <h2>Imagenes externas</h2>
   <img src="https://picsum.photos/200/300" alt="Imagen Aleteoria desde Lorem Picsum"/>

 <h2>Imagenes interna</h2>
   <img  src="imagenes/Jungkook.png" alt="El amor de mi vida y solo es mio, mio, mio jijiji" width="200px" width="300px"/>


</body>
</html>
