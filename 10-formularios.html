<!-- 
 
  Formularios

  Son elementos que permiten el ingreso de informacion por parte usuario.

  Para el contenedor de un formulario se usa

  <form>...</form>

  Dentro de este elemento se colocan los campos (fields) y etiqueta (labels).

  <input /> Campo de acceso de una informacion. Son elementos self-closing. Y hay de diferentes tipos texto, boton, chekbox, etc...

  <labels

  PARAMETROS
  
  Para labels:
      for indica la relacion con el input.

    Para input:
      type el tipo de campo
      name
      placeholder
      id identificar para programar y validar el formulario.

      Otros elemetos que se usan en el formulario son:

      <select>... </select




-->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
  </head>
  <body>
     <h1>Formulario</h1>

     <form>
        <labe>Nombre:</labe>
        <input type="text" name="sepa la bola"/>
     </form>

  </body>
  </html>
