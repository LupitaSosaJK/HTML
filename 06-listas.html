<!--
 
 Listas

 nos ayudan a estructuras informacion ordenada y no ordenada.
 Ordenadas llevan numeracion y la sintaxis es:

 <ol>...</ol>

 Para los elementos de lista se usa la sintaxis:
 
 <li>...</li>

 Existe el atributo "type" que nos permite cambiar el tipoo de numeracion y bullet de las listas.

 1... type"1" (numeros)
 A... type"el afabetico"
 I... type"tipo romano"

 Para las listas


-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <p> Tenemos listas ordenadas y no ordenadas</p>

    <h2> Mi comida favorita</h2>
    <ol type="Sepa la bola">
     <li>Pizza</li>
     <li>Hot dog</li>
     <li>ensalada</li>
     <li>Amen</li>
    </ol>

    <h2>Mis artistas favoritos</h2>
    <ul>
         <li>BTS</li>
         <li>TXT</li>
         <li>ConanGray</li>
         <li>NewJeans</li>
    </ul>
</body>
</html>
