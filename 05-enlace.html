<!--
 
 Enlaces
 
 Los enlaces nos permiten crear navegaciones internas y externa html.

 Sintaxis:
 
 <a>...</a>

 Los enlaces requieren del atributo "HRFE" para funcionar como los elementos de navegacion.
 
 <a href="...">...</a>
 El atributo "herf" pueden recibir varios valores, entre ellos:
 URL externa
 La ruta (path)
 El id de un elemto de html
 #DeadLink (enlace muerto)

 El atributo "target" nos premite indicarle al enlace que se debe abrir en una pestaña, cuando usamos el valor "-blank"
-->
  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"
    <meta name="viewport" content="width=device-width, initiial-scale=1.0">
    <title>Enlace</title>
</head>
<body>
